# Tells Argo CD to watch a folder in a git repo and keep the cluster in sync with it (GitOps).
# Change repoURL to your own repo and apply it with `kubectl apply -n argocd -f argocd-app.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nathanphoffman/Playground
    targetRevision: main
    path: DevOps/helm-argocd/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: { prune: true, selfHeal: true }
